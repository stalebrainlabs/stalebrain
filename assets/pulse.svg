  <text x="32" y="420" font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif" font-size="13" fill="#A79B87">plain Unicode · zero dependencies · ASCII fallback · spec in references/output-format.md</text>
