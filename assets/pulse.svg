    <text x="32" y="122"><tspan fill="#E63A0C">[stale-brain]</tspan><tspan fill="#5C5142"> verifying 39/39 · </tspan><tspan fill="#C42B08">&#9679;13</tspan><tspan fill="#5C5142"> </tspan><tspan fill="#D9930D">&#9679;10</tspan><tspan fill="#5C5142"> </tspan><tspan fill="#A79B87">&#9679;4</tspan><tspan fill="#5C5142"> </tspan><tspan fill="#2F9E44">&#9679;12</tspan></text>
  </g>

  <!-- Band 2: health bar + token meter -->
  <g>
    <rect x="32"  y="186" width="42" height="20" rx="6" fill="#C42B08"/>
    <rect x="80"  y="186" width="42" height="20" rx="6" fill="#C42B08"/>
    <rect x="128" y="186" width="42" height="20" rx="6" fill="#C42B08"/>
    <rect x="176" y="186" width="42" height="20" rx="6" fill="#D9930D"/>
    <rect x="224" y="186" width="42" height="20" rx="6" fill="#D9930D"/>
    <rect x="272" y="186" width="42" height="20" rx="6" fill="#2F9E44"/>
    <rect x="320" y="186" width="42" height="20" rx="6" fill="#2F9E44"/>
    <rect x="368" y="186" width="42" height="20" rx="6" fill="#2F9E44"/>
    <rect x="416" y="186" width="42" height="20" rx="6" fill="#2F9E44"/>
    <rect x="464" y="186" width="42" height="20" rx="6" fill="#2F9E44"/>
    <text x="526" y="202" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#33291F">health 58/100</text>
