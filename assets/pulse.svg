  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
    <text x="32" y="238"><tspan fill="#5C5142">misleading  </tspan><tspan fill="#D9930D">&#9619;&#9619;&#9619;</tspan><tspan fill="#CBBFA9">&#9617;&#9617;&#9617;&#9617;&#9617;&#9617;&#9617;</tspan><tspan fill="#33291F">  ~1.4k of 4.8k always-loaded tokens (29%) carry stale or false claims</tspan></text>
