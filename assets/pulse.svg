    <text x="32" y="168">THE GRAPHS</text>
    <text x="32" y="292">THE TREND</text>
  </g>

  <!-- Band 1: ticker, the audit's tail -f -->
  <g font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
    <text x="32" y="74"><tspan fill="#E63A0C">[stale-brain]</tspan><tspan fill="#5C5142"> inventory · 7 files (4 always-loaded ~4.8k + 3 on-demand ~2.2k)</tspan></text>
